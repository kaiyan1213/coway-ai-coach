<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Coway AI Coach</title>
  <style>
    /* ── 基础 ─────────────────────────────────────────────── */
    :root {
      --blue:   #3B82F6; --blue-bg:   #DBEAFE; --blue-txt:   #1D4ED8;
      --yellow: #F59E0B; --yellow-bg: #FEF3C7; --yellow-txt: #92400E;
      --red:    #EF4444; --red-bg:    #FEE2E2; --red-txt:    #991B1B;
      --green:  #10B981; --green-bg:  #D1FAE5; --green-txt:  #065F46;
      --gray:   #6B7280; --gray-bg:   #F3F4F6; --gray-txt:   #374151;
      --primary: #6366F1;
      --bg: #F9FAFB; --card: #fff; --border: #E5E7EB;
      --text: #111827; --muted: #6B7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: var(--bg); color: var(--text); font-size: 15px; }
    .view { display: none; flex-direction: column; min-height: 100vh; }
    .view.active { display: flex; }
    button { cursor: pointer; font-family: inherit; }
    textarea, input, select {
      font-family: inherit; font-size: 15px;
      outline: none; border: 1.5px solid var(--border); border-radius: 10px;
    }
    textarea:focus, input:focus, select:focus { border-color: var(--primary); }

    /* ── 状态徽章 ─────────────────────────────────────────── */
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 20px;
      font-size: 12px; font-weight: 600; white-space: nowrap;
    }
    .badge-新客户 { background: var(--blue-bg); color: var(--blue-txt); }
    .badge-考虑中 { background: var(--yellow-bg); color: var(--yellow-txt); }
    .badge-需跟进 { background: var(--red-bg); color: var(--red-txt); }
    .badge-成交   { background: var(--green-bg); color: var(--green-txt); }
    .badge-冷了   { background: var(--gray-bg); color: var(--gray-txt); }

    /* ── 登录页 ──────────────────────────────────────────── */
    #view-login {
      align-items: center; justify-content: center;
      padding: 24px 20px; background: var(--bg);
    }
    .login-card {
      background: var(--card); border-radius: 20px;
      padding: 32px 24px; width: 100%; max-width: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    .login-logo { font-size: 28px; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
    .login-sub  { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
    .login-label { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .login-select, .login-pin {
      width: 100%; padding: 12px 14px; margin-bottom: 14px;
      border-radius: 12px; border: 1.5px solid var(--border); background: var(--bg);
    }
    .btn-login {
      width: 100%; padding: 14px; background: var(--primary); color: #fff;
      border: none; border-radius: 12px; font-size: 16px; font-weight: 700;
      margin-top: 4px; transition: opacity .15s;
    }
    .btn-login:active { opacity: .8; }
    #login-error { color: var(--red); font-size: 13px; margin-top: 10px; display: none; }

    /* ── 客户列表页 ───────────────────────────────────────── */
    .list-header {
      background: var(--card); padding: 16px 16px 0;
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10;
    }
    .list-header-top {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
    }
    .list-title { font-size: 18px; font-weight: 700; }
    .list-staff { font-size: 13px; color: var(--muted); }
    .btn-new {
      background: var(--primary); color: #fff; border: none;
      border-radius: 20px; padding: 8px 16px; font-size: 14px; font-weight: 600;
    }
    .filter-bar {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px;
      scrollbar-width: none; -ms-overflow-style: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-btn {
      padding: 5px 14px; border-radius: 20px; border: 1.5px solid var(--border);
      background: var(--bg); color: var(--muted); font-size: 13px; font-weight: 500;
      white-space: nowrap;
    }
    .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .customer-list { flex: 1; padding: 12px; }
    .customer-card {
      background: var(--card); border-radius: 14px; padding: 14px 16px;
      margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 1px 4px rgba(0,0,0,.06); cursor: pointer; transition: box-shadow .15s;
    }
    .customer-card:active { box-shadow: 0 0 0 2px var(--primary); }
    .customer-label { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
    .customer-time  { font-size: 12px; color: var(--muted); }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-icon  { font-size: 40px; margin-bottom: 12px; }

    /* ── Thread 页 ───────────────────────────────────────── */
    #view-thread { background: var(--bg); }
    .thread-header {
      background: var(--card); padding: 14px 16px;
      display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10;
    }
    .btn-back {
      background: none; border: none; font-size: 22px; color: var(--primary); padding: 0 4px;
    }
    .thread-title { font-weight: 700; font-size: 17px; flex: 1; }
    .status-bar {
      background: var(--card); padding: 10px 12px;
      display: flex; gap: 6px; overflow-x: auto;
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }
    .status-bar::-webkit-scrollbar { display: none; }
    .status-btn {
      padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--border);
      background: var(--bg); font-size: 13px; font-weight: 500; color: var(--muted);
      white-space: nowrap;
    }
    .status-btn.active-新客户 { background: var(--blue-bg); color: var(--blue-txt); border-color: var(--blue); }
    .status-btn.active-考虑中 { background: var(--yellow-bg); color: var(--yellow-txt); border-color: var(--yellow); }
    .status-btn.active-需跟进 { background: var(--red-bg); color: var(--red-txt); border-color: var(--red); }
    .status-btn.active-成交   { background: var(--green-bg); color: var(--green-txt); border-color: var(--green); }
    .status-btn.active-冷了   { background: var(--gray-bg); color: var(--gray-txt); border-color: var(--gray); }

    /* 互动历史 */
    .thread-content { flex: 1; overflow-y: auto; padding: 12px 12px 4px; }
    .history-item {
      background: var(--card); border-radius: 12px; margin-bottom: 10px;
      padding: 12px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }
    .history-time { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .history-summary { font-size: 14px; font-weight: 500; margin-bottom: 6px; }
    .history-toggle {
      font-size: 12px; color: var(--primary); background: none; border: none;
      padding: 0; font-weight: 500;
    }
    .history-suggestion {
      display: none; margin-top: 8px; padding-top: 8px;
      border-top: 1px solid var(--border); font-size: 14px; line-height: 1.6;
      color: #374151;
    }
    .history-suggestion.open { display: block; }
    .no-history { text-align: center; padding: 24px; color: var(--muted); font-size: 14px; }

    /* AI 回复结果卡片 */
    .ai-result-card {
      background: #EEF2FF; border: 1.5px solid var(--primary);
      border-radius: 14px; padding: 16px; margin-bottom: 12px;
    }
    .ai-result-label { font-size: 12px; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
    .ai-suggestion-text {
      font-size: 15px; line-height: 1.65; color: var(--text); margin-bottom: 10px;
      white-space: pre-wrap;
    }
    .ai-reasoning { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
    .btn-copy {
      background: var(--primary); color: #fff; border: none;
      border-radius: 8px; padding: 9px 18px; font-size: 14px; font-weight: 600;
    }

    /* 操作区 */
    .action-area {
      background: var(--card); border-top: 1px solid var(--border);
      padding: 12px 14px 20px;
    }
    .action-tabs {
      display: flex; gap: 8px; margin-bottom: 12px;
    }
    .tab-btn {
      flex: 1; padding: 8px; border-radius: 8px; border: 1.5px solid var(--border);
      background: var(--bg); font-size: 13px; font-weight: 500; color: var(--muted);
    }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .upload-zone {
      border: 2px dashed var(--border); border-radius: 10px; padding: 16px;
      text-align: center; color: var(--muted); font-size: 14px; cursor: pointer;
      margin-bottom: 10px;
    }
    .upload-zone:active { border-color: var(--primary); }
    #image-previews {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px;
    }
    .preview-wrap {
      position: relative; width: 72px; height: 72px;
    }
    .preview-wrap img {
      width: 72px; height: 72px; object-fit: cover; border-radius: 8px;
    }
    .preview-rm {
      position: absolute; top: -6px; right: -6px;
      background: var(--red); color: #fff; border: none;
      border-radius: 50%; width: 20px; height: 20px; font-size: 12px; line-height: 20px;
      text-align: center; padding: 0;
    }
    .action-textarea {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--border);
      resize: none; font-size: 14px; margin-bottom: 10px; background: var(--bg);
    }
    .btn-submit {
      width: 100%; padding: 13px; background: var(--primary); color: #fff;
      border: none; border-radius: 12px; font-size: 15px; font-weight: 700;
    }
    .btn-submit:disabled { background: #A5B4FC; cursor: not-allowed; }
    .loading-text { text-align: center; color: var(--primary); font-size: 14px; padding: 6px; }

    /* 新客户弹窗 */
    .modal-mask {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
      z-index: 100; align-items: flex-end; justify-content: center;
    }
    .modal-mask.open { display: flex; }
    .modal-box {
      background: var(--card); width: 100%; max-width: 500px;
      border-radius: 20px 20px 0 0; padding: 24px 20px 36px;
    }
    .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 16px; }
    .modal-input {
      width: 100%; padding: 12px 14px; border-radius: 12px;
      border: 1.5px solid var(--border); font-size: 16px; margin-bottom: 12px;
      background: var(--bg);
    }
    .modal-actions { display: flex; gap: 10px; }
    .btn-confirm { flex: 2; padding: 13px; background: var(--primary); color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; }
    .btn-cancel  { flex: 1; padding: 13px; background: var(--gray-bg); color: var(--gray-txt); border: none; border-radius: 12px; font-size: 15px; font-weight: 600; }

    /* Toast */
    #toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.75); color: #fff; padding: 8px 18px;
      border-radius: 20px; font-size: 14px; pointer-events: none;
      opacity: 0; transition: opacity .2s; z-index: 999;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<!-- ─── 登录页 ───────────────────────────────────────────── -->
<div id="view-login" class="view">
  <div class="login-card">
    <div class="login-logo">Coway AI Coach</div>
    <div class="login-sub">销售回复教练 · 请登录</div>
    <div class="login-label">选择你的名字</div>
    <select id="login-name" class="login-select">
      <option value="">-- 读取中... --</option>
    </select>
    <div class="login-label">PIN 码</div>
    <input id="login-pin" class="login-pin" type="password" inputmode="numeric"
           placeholder="输入 PIN" autocomplete="current-password" maxlength="10">
    <button class="btn-login" onclick="doLogin()">登录</button>
    <div id="login-error">名字或 PIN 错误，请重试</div>
  </div>
</div>

<!-- ─── 客户列表页 ──────────────────────────────────────── -->
<div id="view-list" class="view">
  <div class="list-header">
    <div class="list-header-top">
      <div>
        <div class="list-title">我的客户</div>
        <div class="list-staff" id="list-staff-name"></div>
      </div>
      <button class="btn-new" onclick="openNewCustomerModal()">+ 新客户</button>
    </div>
    <div class="filter-bar" id="filter-bar">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">全部</button>
      <button class="filter-btn" data-filter="新客户" onclick="setFilter('新客户')">新客户</button>
      <button class="filter-btn" data-filter="考虑中" onclick="setFilter('考虑中')">考虑中</button>
      <button class="filter-btn" data-filter="需跟进" onclick="setFilter('需跟进')">需跟进</button>
      <button class="filter-btn" data-filter="成交"   onclick="setFilter('成交')">成交</button>
      <button class="filter-btn" data-filter="冷了"   onclick="setFilter('冷了')">冷了</button>
    </div>
  </div>
  <div class="customer-list" id="customer-list"></div>
</div>

<!-- ─── Thread 页 ─────────────────────────────────────── -->
<div id="view-thread" class="view">
  <div class="thread-header">
    <button class="btn-back" onclick="goBack()">‹</button>
    <div class="thread-title" id="thread-label">—</div>
  </div>
  <div class="status-bar" id="status-bar"></div>

  <div class="thread-content" id="thread-content">
    <div id="ai-result-area"></div>
    <div id="history-list"></div>
  </div>

  <div class="action-area">
    <div class="action-tabs">
      <button class="tab-btn active" id="tab-btn-ss"   onclick="switchTab('screenshot')">截图问怎么回</button>
      <button class="tab-btn"        id="tab-btn-qa"   onclick="switchTab('qa')">直接问</button>
    </div>

    <!-- 截图 tab -->
    <div class="tab-panel active" id="tab-screenshot">
      <input type="file" id="file-input" accept="image/*" multiple style="display:none"
             onchange="onFilesSelected(this.files)">
      <div class="upload-zone" onclick="document.getElementById('file-input').click()">
        📷 点击选择 / 拍摄截图（最多 3 张）
      </div>
      <div id="image-previews"></div>
      <textarea id="ss-note" class="action-textarea" rows="2"
                placeholder="可选：补充说明（如：客户今天再问一次价格）"></textarea>
      <div id="ss-loading" class="loading-text" style="display:none">正在分析截图...</div>
      <button id="btn-ss-submit" class="btn-submit" onclick="submitScreenshot()">分析并给建议</button>
    </div>

    <!-- 直接问 tab -->
    <div class="tab-panel" id="tab-qa">
      <textarea id="qa-question" class="action-textarea" rows="3"
                placeholder="输入产品知识类问题，例如：Coway X 型号有几个颜色？"></textarea>
      <div id="qa-loading" class="loading-text" style="display:none">正在查询...</div>
      <button id="btn-qa-submit" class="btn-submit" onclick="submitQuestion()">提问</button>
    </div>
  </div>
</div>

<!-- ─── 新客户弹窗 ─────────────────────────────────────── -->
<div class="modal-mask" id="modal-new" onclick="closeNewCustomerModal(event)">
  <div class="modal-box">
    <div class="modal-title">+ 新增客户</div>
    <input id="new-label" class="modal-input" type="text"
           placeholder="客户名字或代号（例：陈太太）" maxlength="50"
           onkeydown="if(event.key==='Enter')confirmNewCustomer()">
    <div class="modal-actions">
      <button class="btn-confirm" onclick="confirmNewCustomer()">建档</button>
      <button class="btn-cancel"  onclick="closeNewCustomerModal()">取消</button>
    </div>
  </div>
</div>

<!-- Toast 提示 -->
<div id="toast"></div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────
const STATUS_LIST = ['新客户', '考虑中', '需跟进', '成交', '冷了'];
// ─────────────────────────────────────────────────────────────

// ─── STATE ────────────────────────────────────────────────────
let S = {
  token: null,
  staffName: null,
  customers: [],
  filter: 'all',
  currentCustomerId: null,
  currentCustomer: null,
  interactions: [],
  selectedImages: [],   // File[]
};

// ─── API HELPER ───────────────────────────────────────────────
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (S.token) headers['Authorization'] = 'Bearer ' + S.token;
  const res = await fetch(path, {
    method: opts.method || 'GET',
    headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json();
  if (res.status === 401) { logout(); throw new Error('session expired'); }
  if (!res.ok) throw new Error(data.error || 'API 错误');
  return data;
}

// ─── VIEW SWITCH ──────────────────────────────────────────────
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + id).classList.add('active');
}

// ─── AUTH ─────────────────────────────────────────────────────
async function init() {
  // 尝试从 localStorage 恢复 session
  const saved = localStorage.getItem('coway_session');
  if (saved) {
    try {
      const sess = JSON.parse(saved);
      S.token = sess.token;
      S.staffName = sess.staffName;
      await loadCustomers();
      renderList();
      document.getElementById('list-staff-name').textContent = sess.staffName;
      showView('list');
      return;
    } catch {
      localStorage.removeItem('coway_session');
      S.token = null;
      S.staffName = null;
    }
  }
  await loadStaffDropdown();
  showView('login');
}

async function loadStaffDropdown() {
  try {
    const data = await api('/api/auth');
    const sel = document.getElementById('login-name');
    sel.innerHTML = '<option value="">-- 选择你的名字 --</option>';
    (data.staff || []).forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.name;
      opt.textContent = s.name + (s.team ? `（${s.team}）` : '');
      sel.appendChild(opt);
    });
  } catch {
    document.getElementById('login-name').innerHTML =
      '<option value="">-- 加载失败，请刷新 --</option>';
  }
}

async function doLogin() {
  const name = document.getElementById('login-name').value;
  const pin  = document.getElementById('login-pin').value.trim();
  document.getElementById('login-error').style.display = 'none';
  if (!name || !pin) { showErr('请选择名字并输入 PIN'); return; }
  try {
    const data = await api('/api/auth', { method: 'POST', body: { name, pin } });
    S.token = data.token;
    S.staffName = data.staffName;
    localStorage.setItem('coway_session', JSON.stringify({ token: data.token, staffName: data.staffName }));
    document.getElementById('list-staff-name').textContent = data.staffName;
    await loadCustomers();
    renderList();
    showView('list');
  } catch (e) {
    showErr(e.message || '登录失败');
  }
}
function showErr(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg;
  el.style.display = 'block';
}
function logout() {
  localStorage.removeItem('coway_session');
  S = { token: null, staffName: null, customers: [], filter: 'all',
        currentCustomerId: null, currentCustomer: null, interactions: [], selectedImages: [] };
  loadStaffDropdown();
  showView('login');
}

// ─── 客户列表 ─────────────────────────────────────────────────
async function loadCustomers() {
  const data = await api('/api/data?action=customers');
  S.customers = data.customers || [];
}

function setFilter(f) {
  S.filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === f);
  });
  renderList();
}

function renderList() {
  const list = document.getElementById('customer-list');
  const filtered = S.filter === 'all'
    ? S.customers
    : S.customers.filter(c => c.status === S.filter);

  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div>
      ${S.filter === 'all' ? '还没有客户，点右上角 + 新增' : '这个状态下暂无客户'}</div>`;
    return;
  }

  list.innerHTML = filtered.map(c => `
    <div class="customer-card" onclick="openThread('${c.id}')">
      <div>
        <div class="customer-label">${esc(c.label)}</div>
        <div class="customer-time">${timeAgo(c.updated_at)}</div>
      </div>
      <span class="badge badge-${c.status}">${c.status}</span>
    </div>`).join('');
}

// ─── 新客户 ────────────────────────────────────────────────────
function openNewCustomerModal() {
  document.getElementById('new-label').value = '';
  document.getElementById('modal-new').classList.add('open');
  setTimeout(() => document.getElementById('new-label').focus(), 100);
}
function closeNewCustomerModal(e) {
  if (!e || e.target === document.getElementById('modal-new')) {
    document.getElementById('modal-new').classList.remove('open');
  }
}
async function confirmNewCustomer() {
  const label = document.getElementById('new-label').value.trim();
  if (!label) { toast('请输入客户名字或代号'); return; }
  try {
    const data = await api('/api/data?action=customer', {
      method: 'POST', body: { label },
    });
    S.customers.unshift(data.customer);
    renderList();
    closeNewCustomerModal();
    toast('客户已建档');
  } catch (e) { toast(e.message); }
}

// ─── THREAD ───────────────────────────────────────────────────
async function openThread(customerId) {
  S.currentCustomerId = customerId;
  S.selectedImages = [];
  document.getElementById('image-previews').innerHTML = '';
  document.getElementById('ss-note').value = '';
  document.getElementById('qa-question').value = '';
  document.getElementById('ai-result-area').innerHTML = '';
  showView('thread');
  await loadThread(customerId);
}

async function loadThread(customerId) {
  try {
    const data = await api(`/api/data?action=interactions&cid=${customerId}`);
    S.currentCustomer = data.customer;
    S.interactions = data.interactions || [];
    document.getElementById('thread-label').textContent = data.customer.label;
    renderStatusBar(data.customer.status);
    renderHistory();
    // 滚到最底
    const content = document.getElementById('thread-content');
    content.scrollTop = content.scrollHeight;
  } catch (e) { toast(e.message); }
}

function renderStatusBar(currentStatus) {
  const bar = document.getElementById('status-bar');
  bar.innerHTML = STATUS_LIST.map(s => `
    <button class="status-btn ${s === currentStatus ? 'active-' + s : ''}"
            onclick="changeStatus('${s}')">${s}</button>`).join('');
}

async function changeStatus(newStatus) {
  try {
    await api('/api/data?action=update-customer', {
      method: 'POST',
      body: { id: S.currentCustomerId, status: newStatus },
    });
    S.currentCustomer.status = newStatus;
    renderStatusBar(newStatus);
    // 同步更新列表里的客户状态
    const c = S.customers.find(x => x.id === S.currentCustomerId);
    if (c) { c.status = newStatus; c.updated_at = new Date().toISOString(); }
    toast('状态已更新');
  } catch (e) { toast(e.message); }
}

function renderHistory() {
  const list = document.getElementById('history-list');
  if (!S.interactions.length) {
    list.innerHTML = '<div class="no-history">暂无互动记录 · 上传截图开始分析</div>';
    return;
  }
  list.innerHTML = S.interactions.map((i, idx) => `
    <div class="history-item">
      <div class="history-time">${formatDate(i.created_at)}</div>
      <div class="history-summary">${esc(i.situation_summary)}</div>
      <button class="history-toggle" onclick="toggleSuggestion(${idx})">查看建议 ▾</button>
      <div class="history-suggestion" id="sug-${idx}">${esc(i.ai_suggestion)}</div>
    </div>`).join('');
}

function toggleSuggestion(idx) {
  const el = document.getElementById('sug-' + idx);
  el.classList.toggle('open');
}

function goBack() {
  showView('list');
  renderList(); // 刷新列表（可能状态已变）
}

// ─── TAB 切换 ─────────────────────────────────────────────────
function switchTab(tab) {
  const isScreenshot = tab === 'screenshot';
  document.getElementById('tab-btn-ss').classList.toggle('active', isScreenshot);
  document.getElementById('tab-btn-qa').classList.toggle('active', !isScreenshot);
  document.getElementById('tab-screenshot').classList.toggle('active', isScreenshot);
  document.getElementById('tab-qa').classList.toggle('active', !isScreenshot);
  // 每次切换 tab 清掉 AI 结果
  document.getElementById('ai-result-area').innerHTML = '';
}

// ─── 图片处理 ────────────────────────────────────────────────
function onFilesSelected(files) {
  const remaining = 3 - S.selectedImages.length;
  const toAdd = Array.from(files).slice(0, remaining);
  S.selectedImages = [...S.selectedImages, ...toAdd];
  renderImagePreviews();
  // 清空 input 以便重复选同一张图
  document.getElementById('file-input').value = '';
}

function removeImage(idx) {
  S.selectedImages.splice(idx, 1);
  renderImagePreviews();
}

function renderImagePreviews() {
  const area = document.getElementById('image-previews');
  area.innerHTML = S.selectedImages.map((file, idx) => {
    const url = URL.createObjectURL(file);
    return `<div class="preview-wrap">
      <img src="${url}" alt="截图${idx+1}">
      <button class="preview-rm" onclick="removeImage(${idx})">×</button>
    </div>`;
  }).join('');
  // 更新上传区提示
  const zone = document.querySelector('.upload-zone');
  if (S.selectedImages.length >= 3) {
    zone.textContent = '已选 3 张（上限）';
  } else {
    zone.textContent = `📷 点击选择 / 拍摄截图（已选 ${S.selectedImages.length}/3）`;
  }
}

// 压缩图片到 JPEG，防止 payload 过大
function compressImage(file, maxW = 1200, quality = 0.85) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ─── AI 提交 ─────────────────────────────────────────────────
async function submitScreenshot() {
  if (!S.selectedImages.length) { toast('请先选择截图'); return; }
  const btn = document.getElementById('btn-ss-submit');
  const loading = document.getElementById('ss-loading');
  btn.disabled = true;
  loading.style.display = 'block';
  document.getElementById('ai-result-area').innerHTML = '';
  try {
    const compressed = await Promise.all(S.selectedImages.map(f => compressImage(f)));
    const note = document.getElementById('ss-note').value.trim();
    const data = await api('/api/coach', {
      method: 'POST',
      body: { customerId: S.currentCustomerId, mode: 'screenshot', images: compressed, note },
    });
    // 显示 AI 建议卡片
    showAIResult({ type: 'screenshot', ...data });
    // 刷新历史
    await loadThread(S.currentCustomerId);
    // 清空输入
    S.selectedImages = [];
    renderImagePreviews();
    document.getElementById('ss-note').value = '';
  } catch (e) {
    toast('分析失败：' + e.message);
  } finally {
    btn.disabled = false;
    loading.style.display = 'none';
  }
}

async function submitQuestion() {
  const question = document.getElementById('qa-question').value.trim();
  if (!question) { toast('请输入问题'); return; }
  const btn = document.getElementById('btn-qa-submit');
  const loading = document.getElementById('qa-loading');
  btn.disabled = true;
  loading.style.display = 'block';
  document.getElementById('ai-result-area').innerHTML = '';
  try {
    const data = await api('/api/coach', {
      method: 'POST',
      body: { customerId: S.currentCustomerId, mode: 'qa', question },
    });
    showAIResult({ type: 'qa', ...data });
    document.getElementById('qa-question').value = '';
  } catch (e) {
    toast('提问失败：' + e.message);
  } finally {
    btn.disabled = false;
    loading.style.display = 'none';
  }
}

// ─── AI 结果展示 ──────────────────────────────────────────────
function showAIResult(data) {
  const area = document.getElementById('ai-result-area');
  const text = data.type === 'screenshot' ? data.suggestion : data.answer;
  const sub  = data.type === 'screenshot'
    ? `<div class="ai-reasoning">💡 ${esc(data.reasoning || '')}</div>`
    : (!data.answered ? '<div class="ai-reasoning">⚠️ 知识库覆盖不到，建议向主管确认</div>' : '');
  area.innerHTML = `
    <div class="ai-result-card">
      <div class="ai-result-label">${data.type === 'screenshot' ? '📋 回复建议' : '💬 问题解答'}</div>
      <div class="ai-suggestion-text" id="ai-text">${esc(text)}</div>
      ${sub}
      <button class="btn-copy" onclick="copyAI()">一键复制</button>
    </div>`;
  // 滚到 AI 结果顶部
  area.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function copyAI() {
  const text = document.getElementById('ai-text').textContent;
  navigator.clipboard.writeText(text).then(() => toast('已复制！')).catch(() => {
    // 降级方案
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('已复制！');
  });
}

// ─── UI HELPERS ───────────────────────────────────────────────
function esc(s) {
  return String(s || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\n/g, '<br>');
}

function timeAgo(isoStr) {
  if (!isoStr) return '';
  const diff = Date.now() - new Date(isoStr).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1)   return '刚刚';
  if (m < 60)  return `${m} 分钟前`;
  const h = Math.floor(m / 60);
  if (h < 24)  return `${h} 小时前`;
  const d = Math.floor(h / 24);
  if (d === 1) return '昨天';
  if (d < 7)   return `${d} 天前`;
  return new Date(isoStr).toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' });
}

function formatDate(isoStr) {
  const d = new Date(isoStr);
  return d.toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' }) +
    ' ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ─── INIT ─────────────────────────────────────────────────────
document.getElementById('login-pin').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

init();
</script>
