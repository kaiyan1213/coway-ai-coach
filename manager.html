<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coway AI Coach — Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F3F4F6; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: #fff; border-radius: 16px; padding: 32px 28px;
      width: 100%; max-width: 360px; box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    p.sub { color: #6B7280; font-size: 14px; margin-bottom: 24px; }
    input {
      width: 100%; padding: 12px 14px; border: 1.5px solid #E5E7EB;
      border-radius: 10px; font-size: 16px; outline: none; margin-bottom: 12px;
    }
    input:focus { border-color: #6366F1; }
    button {
      width: 100%; padding: 13px; background: #6366F1; color: #fff;
      border: none; border-radius: 10px; font-size: 16px; font-weight: 600;
      cursor: pointer; margin-top: 4px;
    }
    button:hover { background: #4F46E5; }
    #error { color: #EF4444; font-size: 14px; margin-top: 10px; display: none; }
    #coming-soon {
      display: none; text-align: center; padding: 40px 0;
      color: #6B7280; font-size: 15px;
    }
    #coming-soon strong { display: block; font-size: 22px; margin-bottom: 8px; color: #111827; }
  </style>
</head>
<body>
  <div class="card">
    <div id="login-area">
      <h1>Manager 登录</h1>
      <p class="sub">Coway AI Coach 管理后台</p>
      <input id="pwd" type="password" placeholder="Manager 密码" autocomplete="current-password">
      <button onclick="login()">登录</button>
      <p id="error">密码错误，请重试</p>
    </div>

    <div id="coming-soon">
      <strong>即将推出</strong>
      Manager 看板功能将在下一个版本上线，<br>
      包括：知识库管理、团队跟进看板、QA 日志审阅。
      <br><br>
      <button onclick="logout()" style="width:auto;padding:8px 20px;background:#6B7280;font-size:14px;">退出</button>
    </div>
  </div>

  <script>
    // 检查是否已登录
    if (sessionStorage.getItem('mgr_ok') === '1') showDashboard();

    async function login() {
      const pwd = document.getElementById('pwd').value;
      // 密码在 server 端验证（通过 api/auth 的 manager 端点）
      // 目前直接用环境变量值做比对已经不安全，这里改为调用后端
      const res = await fetch('/api/auth?mgr=1', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ manager_password: pwd }),
      });
      if (res.ok) {
        sessionStorage.setItem('mgr_ok', '1');
        showDashboard();
      } else {
        document.getElementById('error').style.display = 'block';
      }
    }

    function logout() {
      sessionStorage.removeItem('mgr_ok');
      location.reload();
    }

    function showDashboard() {
      document.getElementById('login-area').style.display = 'none';
      document.getElementById('coming-soon').style.display = 'block';
    }

    document.getElementById('pwd').addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
